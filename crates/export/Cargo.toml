zavyx-codecs = { workspace = true }
zavyx-project = { workspace = true }
zavyx-render = { workspace = true }
zavyx-audio-dsp = { workspace = true }
zavyx-geom = { workspace = true }
zavyx-text = { workspace = true }
zavyx-isobmff = { workspace = true }
zavyx-prores = { workspace = true }
zavyx-dnx = { workspace = true }
zavyx-apv = { workspace = true }
zavyx-mxf = { workspace = true }
zavyx-aac = { workspace = true }
zavyx-flac = { workspace = true }
zavyx-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

