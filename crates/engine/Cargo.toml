[package]
name = "zavyx-engine"
description = "Zavyx VE engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["zavyx-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["zavyx-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["zavyx-tts/kokoro", "speech-download"]

[dependencies]
zavyx-time = { workspace = true }
zavyx-geom = { workspace = true }
zavyx-color = { workspace = true }
zavyx-frame = { workspace = true }
zavyx-media = { workspace = true }
zavyx-codecs = { workspace = true }
zavyx-project = { workspace = true }
zavyx-edit = { workspace = true }
zavyx-render = { workspace = true }
zavyx-scopes = { workspace = true }
zavyx-text = { workspace = true }
zavyx-audio-dsp = { workspace = true }
zavyx-export = { workspace = true }
zavyx-mxf = { workspace = true }
zavyx-format = { workspace = true }
zavyx-interchange = { workspace = true }
zavyx-captions = { workspace = true }
zavyx-speech = { workspace = true }
zavyx-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
craft-docpath = { workspace = true }
web-time = "1"

[dev-dependencies]
zavyx-testkit = { workspace = true }
zavyx-dng = { workspace = true, features = ["writer"] }
zavyx-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
