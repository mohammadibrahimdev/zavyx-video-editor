[package]
name = "zavyx-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
zavyx-time = { workspace = true }
zavyx-geom = { workspace = true }
zavyx-color = { workspace = true }
zavyx-frame = { workspace = true }
zavyx-media = { workspace = true }
zavyx-project = { workspace = true }
zavyx-audio-dsp = { workspace = true }
zavyx-captions = { workspace = true }
zavyx-text = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
