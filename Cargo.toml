[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["zavyx/patches"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/mohammadibrahimdev/zavyx-video-editor"

[workspace.dependencies]
# internal
zavyx-time = { path = "crates/time" }
zavyx-geom = { path = "crates/geom" }
zavyx-color = { path = "crates/color" }
zavyx-bitstream = { path = "crates/bitstream" }
zavyx-isobmff = { path = "crates/isobmff" }
zavyx-avi = { path = "crates/avi" }
zavyx-matroska = { path = "crates/matroska" }
zavyx-mxf = { path = "crates/mxf" }
zavyx-cfb = { path = "crates/cfb" }
zavyx-mpegts = { path = "crates/mpegts" }
zavyx-mpeg2v = { path = "crates/mpeg2v" }
zavyx-ac3 = { path = "crates/ac3" }
zavyx-mpa = { path = "crates/mpa" }
zavyx-ogg = { path = "crates/ogg" }
zavyx-h264 = { path = "crates/h264" }
zavyx-hevc = { path = "crates/hevc" }
zavyx-vp8 = { path = "crates/vp8" }
zavyx-vp9 = { path = "crates/vp9" }
zavyx-prores = { path = "crates/prores" }
zavyx-dnx = { path = "crates/dnx" }
zavyx-apv = { path = "crates/apv" }
zavyx-dng = { path = "crates/dng" }
zavyx-av1 = { path = "crates/av1" }
zavyx-aac = { path = "crates/aac" }
zavyx-flac = { path = "crates/flac" }
zavyx-opus = { path = "crates/opus" }
zavyx-h264enc = { path = "crates/h264enc" }
zavyx-audio-dsp = { path = "crates/audio-dsp" }
zavyx-frame = { path = "crates/frame" }
zavyx-media = { path = "crates/media" }
zavyx-codecs = { path = "crates/codecs" }
zavyx-project = { path = "crates/project" }
zavyx-edit = { path = "crates/edit" }
zavyx-interchange = { path = "crates/interchange" }
zavyx-text = { path = "crates/text" }
zavyx-captions = { path = "crates/captions" }
zavyx-speech = { path = "crates/speech" }
zavyx-tts = { path = "crates/tts" }
zavyx-tts-text = { path = "crates/tts-text" }
zavyx-render = { path = "crates/render" }
zavyx-gpu = { path = "crates/gpu" }
zavyx-scopes = { path = "crates/scopes" }
zavyx-export = { path = "crates/export" }
zavyx-format = { path = "crates/format" }
zavyx-engine = { path = "crates/engine" }
zavyx-ui-egui = { path = "crates/ui-egui" }
zavyx-automation = { path = "crates/automation" }
zavyx-platform = { path = "crates/platform" }
zavyx-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
craft-media = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", default-features = false }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", features = ["serde", "native-windows"] }
# egui 0.37: bundled fonts are opt-in, and the monochrome symbol/emoji faces moved to their own
# feature. Zavyx VE paints ✔ ✓ ✖ ⚡ ⚠ ⚙ ♪ ☑ in panel chrome, so both features are part of the
# production font policy (system_fonts stays off).
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "04aa1703b32d299e54f78fcde4182f2b393a9116", features = ["egui"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.zavyx-h264]
opt-level = 3

[profile.dev.package.zavyx-h264enc]
opt-level = 3

[profile.dev.package.zavyx-hevc]
opt-level = 3

[profile.dev.package.zavyx-prores]
opt-level = 3

[profile.dev.package.zavyx-dnx]
opt-level = 3

[profile.dev.package.zavyx-apv]
opt-level = 3

[profile.dev.package.zavyx-dng]
opt-level = 3

[profile.dev.package.zavyx-av1]
opt-level = 3

[profile.dev.package.zavyx-aac]
opt-level = 3

[profile.dev.package.zavyx-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.zavyx-audio-dsp]
opt-level = 3

[profile.dev.package.zavyx-mxf]
opt-level = 3

[profile.dev.package.zavyx-opus]
opt-level = 3

[profile.dev.package.zavyx-vp8]
opt-level = 3

[profile.dev.package.zavyx-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Keep the complete egui family and native event bridge on reviewed fork commits.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# Zavyx: wgpu-hal 30.0.1 with the 32-bit DX12 pipeline fix (zavyx/patches/README.md).
wgpu-hal = { path = "zavyx/patches/wgpu-hal" }
