[package]
name = "zavyx-ve-cli"
description = "Zavyx VE headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "zavyx-ve-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["zavyx-engine/whisper", "zavyx-engine/speech-download"]

[dependencies]
zavyx-engine = { workspace = true }
zavyx-export = { workspace = true }
zavyx-project = { workspace = true }
zavyx-render = { workspace = true }
zavyx-time = { workspace = true }
zavyx-gpu = { workspace = true }
zavyx-media = { workspace = true }
zavyx-codecs = { workspace = true }
zavyx-platform = { workspace = true }
zavyx-mxf = { workspace = true }
zavyx-mpegts = { workspace = true }
zavyx-ogg = { workspace = true }
zavyx-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
zavyx-testkit = { workspace = true }
